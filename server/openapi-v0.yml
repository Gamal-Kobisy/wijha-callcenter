openapi: '3.0.3'
info:
  title: API Title
  version: '1.0'
servers:
  - url: https://api.server.test/v0
components:
  securitySchemes:
    apiKeyAuth:                    # ← Your chosen name
      type: apiKey
      in: header                   # ← Where to look (header, query, or cookie)
      name: X-API-Key              # ← The exact header/key name
  schemas:
    status:
      type: string
      enum:
        - active
        - inactive
    owner:
      type: object
      properties:
        name:
          type: string
        numbers:
          type: array
          items:
            type: string
        projectId:
          type: string
        status:
          $ref: '#/components/schemas/status'
security:
  - apiKeyAuth: []
paths:
  /:
    get:
      summary: Root endpoint
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Hello World!
  /login:
    post:
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid username or password
  /owners:
    get:
      summary: Get a list of 10 owners
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Number of items to return
        - in: query
          name: projectId
          schema:
            type: string
          description: Filter owners by project ID
        - in: query
          name: status
          schema:
            type: string
            enum: [active, inactive]
          description: Filter owners by status
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/owner'
    post:
      summary: Create a new owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/owner'
      responses:
        '201':
          description: Owner created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Owner created successfully
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid input data
  /owners/ready-to-call:
    get:
      summary: Get owner information
      parameters:
        - in: query
          name: projectId
          schema:
            type: string
          description: Filter owner by project ID
        - in: query
          name: status
          schema:
            type: string
            enum: [active, inactive]
          description: Filter owner by status
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/owner'